name: Release

# Two ways in:
#
#   * Push a tag `vX.Y.Z` — publishes that version and creates a GitHub
#     release with the .vsix attached. Every published version gets a tag.
#   * Run the workflow by hand — publishes from whatever ref you picked, or
#     with `dry_run` just builds the .vsix for inspection.
#
# The channel is decided by the version alone, never by how the workflow was
# started: an odd minor (0.1.x, 0.3.x) is a pre-release, an even minor (0.2.x,
# 1.0.x) is stable. That is the Marketplace's own convention for keeping the
# two channels from colliding
# (https://code.visualstudio.com/api/working-with-extensions/publishing-extension#prerelease-extensions).
#
# Both targets get the same .vsix: the Visual Studio Marketplace and Open VSX.
# The version in package.json is the version that ships, and a tag must match it.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check the .vsix but do not publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      vsix: ${{ steps.meta.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the ancestry check below needs history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: npm ci

      # Only code that has landed on main ships. A tag on an unmerged or stale
      # branch would otherwise publish to both stores and GitHub. Dry runs are
      # exempt so a branch can be packaged for inspection before it merges.
      - name: Require the ref to be on main
        if: ${{ !inputs.dry_run }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; merge it first"
            exit 1
          fi

      - name: Decide channel and check the version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $version is not plain major.minor.patch; the Marketplace rejects suffixes"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          minor=$(echo "$version" | cut -d. -f2)
          if [ $((minor % 2)) -eq 1 ]; then prerelease=true; else prerelease=false; fi
          echo "channel: $([ "$prerelease" = true ] && echo pre-release || echo stable) ($version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "vsix=just-lang-$version.vsix" >> "$GITHUB_OUTPUT"

      # The whole CI gate, repeated here so nothing ships that CI never saw
      # green. The differential suite runs against the newest just in the CI
      # matrix; the older versions are covered by the PR run.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:diff

      - name: Package
        run: |
          flag=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then flag="--pre-release"; fi
          npx @vscode/vsce package $flag --out "${{ steps.meta.outputs.vsix }}"
          npx @vscode/vsce ls --tree

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          flag=""
          if [ "${{ needs.package.outputs.prerelease }}" = "true" ]; then flag="--pre-release"; fi
          npx @vscode/vsce publish $flag --skip-duplicate --packagePath "${{ needs.package.outputs.vsix }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          flag=""
          if [ "${{ needs.package.outputs.prerelease }}" = "true" ]; then flag="--pre-release"; fi
          npx ovsx publish $flag --skip-duplicate "${{ needs.package.outputs.vsix }}"

      - name: GitHub release with the .vsix attached
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          if [ "${{ needs.package.outputs.prerelease }}" = "true" ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "${{ needs.package.outputs.vsix }}" $flag \
            --title "v${{ needs.package.outputs.version }}" \
            --notes-from-tag \
            --verify-tag
